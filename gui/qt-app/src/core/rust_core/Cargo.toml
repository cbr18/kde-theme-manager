[package]
name = "kde_theme_core"
version = "0.4.0"
edition = "2021"
description = "KDE Theme Profile Manager - Rust Core Library"
license = "MIT"
repository = "https://github.com/cbr18/kde-theme-manager"

[lib]
name = "kde_theme_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# FFI support
libc = "0.2"
once_cell = "1.19"

# Config parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ini = "2.0"
configparser = "3.3"

# File system
dirs = "5.0"
walkdir = "2.3"

# Process execution
tokio = { version = "1.0", features = ["process", "rt-multi-thread"] }
which = "6.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# FFI helpers
bitflags = "2.0"

[build-dependencies]
cc = "1.0"

[profile.release]
lto = true
strip = true
codegen-units = 1