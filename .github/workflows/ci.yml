name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Syntax check (bash -n)
        run: |
          for f in files/bin/* scripts/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Shellcheck
        run: |
          shellcheck files/bin/* scripts/*.sh tests/*.sh

      - name: Run test suite
        run: bash tests/test-scripts.sh
