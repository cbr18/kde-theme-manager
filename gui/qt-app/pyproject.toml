[project]
name = "kde-theme-manager"
version = "0.4.0"
description = "KDE Plasma Theme Profile Manager - Qt/QML UI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "cbr", email = "b.r.g.200306@gmail.com"}
]
keywords = ["kde", "plasma", "theme", "profile", "qt", "qml", "kirigami"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: KDE",
]
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyright>=1.1",
]

[project.scripts]
kde-theme-manager = "src.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "ANN", "T20"]
ignore = ["ANN101", "ANN102", "T201", "T203"]
src = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"